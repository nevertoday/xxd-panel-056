      <rect x="117" width="88" height="34" rx="8" fill="#E07858"/><text x="161" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">4 MODES</text>
      <rect x="217" width="132" height="34" rx="8" fill="#6AAE9E"/><text x="283" y="22" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="11" font-weight="900">WALLPAPER PACK</text>
    </g>

