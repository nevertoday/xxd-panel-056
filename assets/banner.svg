<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 056</title>
  <desc>Reduce a photograph to one core image in vast near-white space, using paused handmade marks, warm-cool colour jumps, and visual metaphor.</desc>
  <defs><clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#FBF7EE"/>
    <path d="M900 11C969 35 1031 12 1092 41C1164 75 1197 144 1167 196C1140 242 1073 247 1017 226C960 205 906 170 883 116C864 72 869 31 900 11Z" fill="#F2C06F" fill-opacity=".34"/>
    <path d="M1056 282C1101 260 1177 272 1211 311V414H982C982 358 1008 307 1056 282Z" fill="#8BC9C0" fill-opacity=".35"/>

    <g transform="translate(58 42)">
