      <text x="16" y="22" fill="white" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
      <text y="112" fill="#303833" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="-3">PANEL <tspan fill="#E07858">056</tspan></text>
      <text x="2" y="151" fill="#6A9D84" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing=".18">CORE IMAGE · VAST WHITESPACE · WARM–COOL JUMPS · NAIVE HAND</text>
      <text x="2" y="198" fill="#303833" font-family="sans-serif" font-size="18" font-weight="800">把独特情绪收进一幅带手绘停顿的视觉记忆</text>
      <text x="2" y="230" fill="#626B61" font-family="sans-serif" font-size="14" font-weight="700">独自の感情を、手描きの間が残る視覚記憶へ</text>
      <text x="2" y="260" fill="#626B61" font-family="sans-serif" font-size="14" font-weight="700">고유한 감정을 손그림의 멈춤이 남은 시각 기억으로</text>
      <text x="2" y="291" fill="#626B61" font-family="Arial,sans-serif" font-size="13" font-weight="700">حفظ شعور فريد في ذاكرة بصرية تحمل وقفات اليد</text>
    </g>

    <g transform="translate(58 334)">
